naftiko: 1.0.0-alpha2
info:
  label: Amazon Managed Service for Apache Flink - Streaming Analytics Workflow
  description: Workflow capability for data engineers and analysts to build, manage, and monitor Apache Flink streaming analytics
    applications on AWS.
  tags:
  - Amazon
  - Apache Flink
  - Streaming Analytics
  - Real-Time Processing
  - Big Data
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: managed-apache-flink
    baseUri: https://kinesisanalytics.amazonaws.com
    description: Amazon Managed Service for Apache Flink REST API
    authentication:
      type: apikey
      key: Authorization
      value: AWS4-HMAC-SHA256 {{AWS_ACCESS_KEY_ID}}
      placement: header
    resources:
    - name: applications
      path: /
      description: Manage Flink streaming applications
      operations:
      - name: create-application
        method: POST
        description: Create a new Flink streaming application
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-applications
        method: POST
        description: List all Flink streaming applications
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: describe-application
        method: POST
        description: Get details of a Flink application
        inputParameters:
        - name: ApplicationName
          in: body
          type: string
          required: true
          description: Application name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: start-application
        method: POST
        description: Start a Flink streaming application
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: stop-application
        method: POST
        description: Stop a Flink streaming application
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-application
        method: POST
        description: Delete a Flink streaming application
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: streaming-analytics-api
    description: Unified REST API for Apache Flink streaming analytics workflows.
    resources:
    - path: /v1/applications
      name: applications
      description: Flink streaming applications
      operations:
      - method: POST
        name: create-application
        description: Create a streaming application
        call: managed-apache-flink.create-application
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: list-applications
        description: List all streaming applications
        call: managed-apache-flink.list-applications
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: streaming-analytics-mcp
    transport: http
    description: MCP server for AI-assisted Apache Flink streaming analytics.
    tools:
    - name: create-streaming-application
      description: Create a new Apache Flink streaming analytics application on AWS
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: managed-apache-flink.create-application
      outputParameters:
      - type: object
        mapping: $.
    - name: list-streaming-applications
      description: List all Flink streaming analytics applications
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: managed-apache-flink.list-applications
      outputParameters:
      - type: object
        mapping: $.
    - name: get-application-details
      description: Get configuration and status details of a Flink application
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: managed-apache-flink.describe-application
      with:
        ApplicationName: tools.ApplicationName
      outputParameters:
      - type: object
        mapping: $.
    - name: start-streaming-application
      description: Start a Flink application to begin real-time stream processing
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: managed-apache-flink.start-application
      outputParameters:
      - type: object
        mapping: $.
    - name: stop-streaming-application
      description: Stop a running Flink streaming application
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: managed-apache-flink.stop-application
      outputParameters:
      - type: object
        mapping: $.
