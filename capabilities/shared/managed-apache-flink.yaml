naftiko: "1.0.0-alpha1"

info:
  label: "Amazon Managed Service for Apache Flink"
  description: "API for creating and managing Apache Flink streaming analytics applications on AWS."
  tags:
    - Amazon
    - Apache Flink
    - Streaming Analytics
    - Real-Time Processing
    - Big Data
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: managed-apache-flink
      baseUri: https://kinesisanalytics.amazonaws.com
      description: "Amazon Managed Service for Apache Flink REST API"
      authentication:
        type: apikey
        key: Authorization
        value: "AWS4-HMAC-SHA256 {{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources:
        - name: applications
          path: /
          description: "Manage Flink streaming applications"
          operations:
            - name: create-application
              method: POST
              description: "Create a new Flink streaming application"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-applications
              method: POST
              description: "List all Flink streaming applications"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: describe-application
              method: POST
              description: "Get details of a Flink application"
              inputParameters:
                - name: ApplicationName
                  in: body
                  type: string
                  required: true
                  description: "Application name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: start-application
              method: POST
              description: "Start a Flink streaming application"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: stop-application
              method: POST
              description: "Stop a Flink streaming application"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-application
              method: POST
              description: "Delete a Flink streaming application"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: flink-api
      resources:
        - path: /v1/applications
          name: applications
          description: "Flink applications"
          operations:
            - method: POST
              name: create-application
              description: "Create application"
              call: "managed-apache-flink.create-application"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: GET
              name: list-applications
              description: "List applications"
              call: "managed-apache-flink.list-applications"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: flink-mcp
      transport: http
      tools:
        - name: create-flink-application
          description: "Create a new Apache Flink streaming analytics application"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "managed-apache-flink.create-application"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-flink-applications
          description: "List all Apache Flink streaming applications"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "managed-apache-flink.list-applications"
          outputParameters:
            - type: object
              mapping: "$."
        - name: describe-flink-application
          description: "Get details and status of a Flink application"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "managed-apache-flink.describe-application"
          with:
            ApplicationName: "tools.ApplicationName"
          outputParameters:
            - type: object
              mapping: "$."
        - name: start-flink-application
          description: "Start a Flink streaming application to begin processing"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "managed-apache-flink.start-application"
          outputParameters:
            - type: object
              mapping: "$."
        - name: stop-flink-application
          description: "Stop a running Flink streaming application"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "managed-apache-flink.stop-application"
          outputParameters:
            - type: object
              mapping: "$."
